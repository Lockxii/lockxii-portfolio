name: Update GitHub activity

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-github-activity.yml
      - scripts/update-github-activity.mjs
      - scripts/update-github-activity.test.mjs

permissions:
  contents: write

concurrency:
  group: github-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Test activity collection
        run: node --test scripts/update-github-activity.test.mjs
      - name: Fetch current GitHub activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-github-activity.mjs
      - name: Commit the refreshed snapshot
        run: |
          git add src/data/github-activity.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh GitHub activity"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
